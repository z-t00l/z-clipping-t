<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUBI TOOL — AI Video Clipping</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#0b0e17;color:#eef1ff;line-height:1.5}
  header{padding:30px 16px 10px;text-align:center}
  .logo{font-size:36px;font-weight:900;letter-spacing:1px}
  .logo span{background:linear-gradient(90deg,#ff3d5a,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:#8b93b8;font-size:14px;margin-top:6px}
  .wrap{max-width:760px;margin:14px auto 40px;padding:0 14px}
  .card{background:#141927;border:1px solid #232a42;border-radius:18px;padding:20px;margin:14px 0}
  .card h2{font-size:16px;margin-bottom:12px;color:#c7cdf5}
  label{display:block;margin:13px 0 6px;font-weight:650;font-size:13.5px;color:#aeb6d8}
  input,select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #2a3352;background:#0e1220;color:#eef1ff;font-size:15.5px;outline:none}
  input:focus,select:focus{border-color:#7c3aed}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .chip{padding:9px 17px;border-radius:999px;border:1.5px solid #2a3352;background:#0e1220;color:#eef1ff;cursor:pointer;font-weight:700;font-size:14.5px}
  .chip.active{background:linear-gradient(120deg,#7c3aed,#2563eb);border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
  .check{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14px;color:#dbe1ff;margin-top:14px}
  .check input{width:auto}
  button.cta{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(120deg,#ff3d5a,#ff7a18);color:#fff;font-size:18px;font-weight:800;cursor:pointer;margin-top:18px}
  button.cta:active{transform:scale(.99)}
  #progwrap{margin-top:16px;display:none}
  #progbar-wrap{background:#232a42;border-radius:99px;height:15px;overflow:hidden;margin-top:7px}
  #progbar{background:linear-gradient(90deg,#7c3aed,#22c55e);height:100%;width:0%;transition:width .4s}
  .muted{color:#8b93b8;font-size:13px;margin-top:7px}
  .ok{color:#4ade80;font-weight:700}
  .warn{color:#ffb86b;font-size:12.5px;margin-top:10px}
  .jobcard{background:#0e1220;border:1px solid #232a42;border-radius:12px;padding:12px}
  footer{text-align:center;color:#5b648a;font-size:12.5px;padding-bottom:26px}
</style>
</head>
<body>
<header>
  <div class="logo">ZUBI <span>TOOL</span></div>
  <p>AI Video Clipping — Free, No Watermark</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Video</h2>
    <label for="url">Video Link (YouTube, TikTok, Instagram, Facebook, ya koi bhi)</label>
    <input id="url" placeholder="https://...">
    <label for="upload">Ya Video / Movie Upload Karo</label>
    <input id="upload" type="file" accept="video/*,.mkv,.mov,.webm">
  </section>

  <section class="card">
    <h2>Settings</h2>
    <label>Kitni Clips?</label>
    <div class="chips" id="chips">
      <button type="button" class="chip" data-n="1">1</button>
      <button type="button" class="chip" data-n="2">2</button>
      <button type="button" class="chip" data-n="3">3</button>
      <button type="button" class="chip" data-n="4">4</button>
      <button type="button" class="chip active" data-n="5">5</button>
      <button type="button" class="chip" data-n="10">10</button>
      <button type="button" class="chip" data-n="15">15</button>
      <button type="button" class="chip" data-n="20">20</button>
    </div>
    <input id="clips" type="number" min="1" max="100" value="5" aria-label="Clips ki quantity">
    <div class="row">
      <div>
        <label for="lang">Video Language</label>
        <select id="lang">
          <option value="auto" selected>Auto Detect</option>
          <option value="ur">Urdu</option><option value="en">English</option>
          <option value="hi">Hindi</option><option value="ar">Arabic</option>
          <option value="es">Spanish</option><option value="fr">French</option>
          <option value="de">German</option><option value="pt">Portuguese</option>
          <option value="tr">Turkish</option><option value="id">Indonesian</option>
          <option value="bn">Bengali</option><option value="pa">Punjabi</option>
        </select>
      </div>
      <div>
        <label for="sublang">Subtitles Language</label>
        <select id="sublang">
          <option value="auto" selected>Auto (video wali)</option>
          <option value="none">Without Subtitles</option>
          <option value="en">English</option><option value="ur">Urdu</option>
          <option value="hi">Hindi</option><option value="ar">Arabic</option>
          <option value="es">Spanish</option><option value="fr">French</option>
          <option value="de">German</option><option value="pt">Portuguese</option>
          <option value="tr">Turkish</option><option value="id">Indonesian</option>
          <option value="bn">Bengali</option><option value="pa">Punjabi</option>
          <option value="ru">Russian</option><option value="ja">Japanese</option>
          <option value="ko">Korean</option><option value="zh">Chinese</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="fit">Style</label>
        <select id="fit">
          <option value="face" selected>Face Tracking</option>
          <option value="blur">Blur Background</option>
        </select>
      </div>
      <div>
        <label for="duration">Clip Duration</label>
        <select id="duration">
          <option value="auto" selected>Auto (25-60 sec)</option>
          <option value="15">15 sec</option>
          <option value="30">30 sec</option>
          <option value="45">45 sec</option>
          <option value="60">60 sec</option>
          <option value="90">90 sec</option>
        </select>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="emoji" checked> Auto Emoji</label>
    <label class="check"><input type="checkbox" id="own"> Meri apni video hai / permission hai</label>
    <p class="warn">Sirf apni ya permission wali video post karo — dusray ki video clip karne se copyright-free nahi banti.</p>
  </section>

  <section class="card">
    <h2>Download</h2>
    <label>Quality: <b style="color:#4ade80">Auto HD</b> (source jitni HD, utni best)</label>
    <label for="dltype">Download Type</label>
    <select id="dltype">
      <option value="single" selected>Single Clip</option>
      <option value="all">All Clips — 1 Click</option>
      <option value="zip">All Clips — ZIP</option>
    </select>
    <button class="cta" id="go">Clips Banao</button>
    <div id="progwrap">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:650"><span id="progstage">Processing...</span><span id="progpct">0%</span></div>
      <div id="progbar-wrap"><div id="progbar"></div></div>
      <p class="muted" id="progleft">100% baqi hai</p>
    </div>
    <p id="out" class="muted"></p>
  </section>

  <section class="card">
    <h2>Clips Gallery</h2>
    <div id="gallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px"></div>
  </section>
</div>
<footer>ZUBI TOOL</footer>

<script>
  const chips=[...document.querySelectorAll('.chip')], clips=document.getElementById('clips');
  chips.forEach(c=>c.onclick=()=>{chips.forEach(x=>x.classList.remove('active'));c.classList.add('active');clips.value=c.dataset.n;});
  clips.oninput=()=>{chips.forEach(x=>x.classList.toggle('active',x.dataset.n===clips.value));};
  const url=document.getElementById('url'), lang=document.getElementById('lang'), fit=document.getElementById('fit'), sublang=document.getElementById('sublang'), duration=document.getElementById('duration'), upload=document.getElementById('upload');
  function renderGallery(){
    const jobs=JSON.parse(localStorage.getItem('clipJobs')||'[]');
    const g=document.getElementById('gallery'); if(!g) return;
    g.innerHTML=jobs.length? jobs.map((j,i)=>`<div class="jobcard"><div style="font-weight:700">Job ${jobs.length-i}: ${j.clips} clips</div><div style="color:#8b93b8;font-size:12px;word-break:break-all">${(j.file||j.url||'').slice(0,50)}</div><div style="color:#7dd3fc;font-size:12px">${j.duration||'auto'}s | ${j.subtitle_language} | ${j.download_type||'single'}</div><div style="color:#8b93b8;font-size:11px">${new Date(j.at).toLocaleString()}</div></div>`).join('') : '<p class="muted">Abhi koi job nahi.</p>';
  }
  document.getElementById('go').onclick=()=>{
    if(!url.value.trim() && !upload.files.length){document.getElementById('out').textContent='Pehle video link dalo ya file upload karo.';return;}
    const job={url:url.value,file:upload.files.length?upload.files[0].name:null,clips:+clips.value||5,duration:duration.value,download_type:document.getElementById('dltype').value,language:lang.value,subtitle_language:sublang.value,subtitles:sublang.value!=='none',fit:fit.value,qualities:['auto'],own:document.getElementById('own').checked,emoji:document.getElementById('emoji').checked,watermark:false,at:new Date().toISOString()};
    const jobs=JSON.parse(localStorage.getItem('clipJobs')||'[]'); jobs.unshift(job); localStorage.setItem('clipJobs',JSON.stringify(jobs));
    const pw=document.getElementById('progwrap'), pb=document.getElementById('progbar'), pp=document.getElementById('progpct'), ps=document.getElementById('progstage'), pl=document.getElementById('progleft');
    pw.style.display='block';
    const stages=[[15,'Link check...'],[35,'Settings save...'],[60,'Job tayyar...'],[85,'Gallery update...'],[100,'Ready!']];
    let si=0;
    const timer=setInterval(()=>{ if(si>=stages.length){clearInterval(timer); renderGallery(); return;} const [pct,txt]=stages[si++]; pb.style.width=pct+'%'; pp.textContent=pct+'%'; ps.textContent=txt; pl.textContent=(100-pct)+'% baqi hai'; },450);
    document.getElementById('out').innerHTML=`<span class="ok">Job ready:</span> ${job.clips} clips, Auto HD quality. GitHub Actions → Make Clips (Free) mein Run karo, ya Jaan ko bhej do.`;
  };
  renderGallery();
</script>
</body>
</html>
